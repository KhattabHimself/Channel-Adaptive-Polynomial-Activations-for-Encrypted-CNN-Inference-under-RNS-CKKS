# The environment every non-encrypted result was produced in (Windows 11,
# laptop CPU). Create it with:  conda env create -f environment.yml
# The encrypted experiments run in the container of scripts/openfhe_docker
# (Python 3.10, openfhe 1.6.1.0.22.4, numpy, pandas).
name: thesis-ckks
channels:
  - defaults
dependencies:
  - python=3.12.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.4.1
      - torchvision==0.19.1
      - numpy==1.26.4
      - pandas==2.2.2
      - scipy==1.13.1
      - statsmodels==0.14.2
      - matplotlib==3.8.4
      - pytest==7.4.4
